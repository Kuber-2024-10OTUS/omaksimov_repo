# This inventory describe a HA typology with stacked etcd (== same nodes as control plane)
# and 3 worker nodes
# See https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# for tips on building your # inventory

# Configure 'ip' variable to bind kubernetes services on a different ip than the default iface
# We should set etcd_member_name for etcd cluster. The node that are not etcd members do not need to set the value,
# or can set the empty string value.
[kube_control_plane]
master1 ansible_host=10.233.20.3  etcd_member_name=etcd1
master2 ansible_host=10.233.10.3  etcd_member_name=etcd2
master3 ansible_host=10.233.30.15  etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
worker1 ansible_host=10.233.20.13
worker2 ansible_host=10.233.30.4

[cluster:children]
kube_control_plane
kube_node

[kube_node:vars]
node_labels={"node-role":"worker"}

[cluster:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q <user>@<bastion_ip>"'
